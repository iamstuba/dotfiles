# Personal overlay, read only when MISE_ENV includes "personal". The installer
# writes env = ["personal"] or env = ["work"] to ~/.config/mise/miserc.toml,
# so every Mac loads exactly one of the two. It holds the dotfiles a work Mac
# must not get, because mise has no way to switch off an entry mise.toml
# declares.

[dotfiles]
# The work Mac keeps its own untracked copy: tools there write into this
# file, and a symlink would send those writes into the tracked one.
"~/.claude/settings.json" = "home/.claude/settings.json"

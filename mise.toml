# Repo-root half of the manifest: packages, the symlink map, macOS defaults,
# hooks, and the tasks that name a repo path. Tools, settings and the other
# tasks are in config/mise/config.toml. Split by scope, not topic: tools are
# only on PATH inside the declaring file's tree, and [dotfiles] sources resolve
# against the declaring file's directory.

min_version = "2026.8.15"  # last release that changed the dotfiles semantics we lean on

# ---------------------------------------------------------------- packages --
# No pins: brew and brew-cask ignore them. Formulae only where mise's own
# backends cannot deliver.

# Take over an app that is already in /Applications instead of replacing it.
# A replace drops the app's privacy grants, and it cannot chown or remove a
# root-owned bundle it moves aside. Self-updating casks are adopted as they
# are; any other cask whose app differs from the download fails and is left
# alone.
[bootstrap.brew]
adopt = true

[bootstrap.packages]
"brew:bash" = "latest"                            # bar plugins need bash 4+
"brew:eza" = "latest"                             # aqua entry is Linux-only
"brew:btop" = "latest"                            # aqua entry is Linux-only
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"
"brew:fzf-tab" = "latest"
# Nothing from a third-party tap belongs in this table, formula or cask. mise
# resolves a tap through its published api/ JSON, which a tap is not required
# to carry and neither FelixKratz/formulae nor nikitabobko/tap does, and its
# fallback evaluates the .rb, which wants Ruby 3 or newer against the 2.6 macOS
# ships. sketchybar, borders and aerospace live in bin/brew-tap-packages, which
# the pre-packages hook runs.

"brew-cask:ghostty" = "latest"
"brew-cask:librewolf" = "latest"
"brew-cask:proton-pass" = "latest"
"brew-cask:slack" = "latest"                              # personal use too, so not the overlay
"brew-cask:karabiner-elements" = "latest"
"brew-cask:thunderbird" = "latest"
"brew-cask:proton-mail-bridge" = "latest"
"brew-cask:vorssaint" = "latest"
"brew-cask:font-monaspace" = "latest"
"brew-cask:font-symbols-only-nerd-font" = "latest"
"brew-cask:font-sketchybar-app-font" = "latest"

# ---------------------------------------------------------------- dotfiles --
# Enumerated, never a wildcard: mise rejects a wildcard plus a specific entry
# under it. Directory symlinks only for zsh, git, nvim, sketchybar, karabiner;
# file-level elsewhere so runtime state stays out of the repo. Each area adds
# its lines when the sources exist.

[dotfiles]
"~/.editorconfig" = "home/.editorconfig"
"~/.ssh/config" = "config/ssh/config"
"~/.config/mise/config.toml" = "config/mise/config.toml"  # file-level: miserc.toml lives beside it

# shell. ~/.zshenv is what finds the clone; everything else hangs off the
# XDG_CONFIG_HOME it exports. config/zsh is a directory symlink, so HISTFILE
# and the compdump are pinned to $HOME.
"~/.zshenv" = "home/.zshenv"
"~/.config/zsh" = "config/zsh"
"~/.config/starship.toml" = "config/starship.toml"
"~/.config/ripgrep/config" = "config/ripgrep/config"
"~/.config/btop/btop.conf" = "config/btop/btop.conf"
"~/.config/btop/themes/tokyonight_night.theme" = "config/btop/themes/tokyonight_night.theme"
"~/.config/eza/theme.yml" = "config/eza/theme.yml"
"~/.config/yazi/theme.toml" = "config/yazi/theme.toml"
"~/.config/tuicr/config.toml" = "config/tuicr/config.toml"
"~/.config/bat/themes/tokyonight_night.tmTheme" = "config/bat/themes/tokyonight_night.tmTheme"

# git. A directory symlink, so config/git/ignore comes along as ~/.config/git/ignore.
# Identity stays untracked: config/git/config ends by including ~/.gitconfig-local.
"~/.config/git" = "config/git"

"~/.config/lazygit/config.yml" = "config/lazygit/config.yml"  # file-level: state.yml lives beside it

# agents. One shared instruction file, which mise.personal.toml also links
# into pi so the rules cannot disagree between them. file-level like lazygit
# above, because herdr's integration refuses a symlinked directory and
# setup-agents runs it. ~/.claude/settings.json is in mise.personal.toml,
# because the work Mac keeps its own.
"~/.claude/CLAUDE.md" = "home/.agents/AGENTS.md"

# herdr. file-level: its config directory also holds the socket, the logs,
# session.json and the installed plugins.
"~/.config/herdr/config.toml" = "config/herdr/config.toml"

# file-level, so the untracked config.local beside it stays out of the clone.
"~/.config/ghostty/config.ghostty" = "config/ghostty/config.ghostty"

# A directory symlink, because Karabiner watches the directory, not the file.
"~/.config/karabiner" = "config/karabiner"

# file-level, so anything else AeroSpace puts in ~/.config/aerospace stays out of the clone.
"~/.config/aerospace/aerospace.toml" = "config/aerospace/aerospace.toml"
# A directory symlink, because sketchybarrc and its plugins will live beside colors.sh.
"~/.config/sketchybar" = "config/sketchybar"

# ---------------------------------------------------------- macos defaults --
# Vetoed line by line. Arrays, dicts, -currentHost and sudo writes are
# in bin/macos-post-defaults.

[bootstrap.macos.dock]
autohide = true
show_recents = false
orientation = "left"
tilesize = 23
mru_spaces = false

[bootstrap.macos.keyboard]
press_and_hold = false
key_repeat = 1
initial_key_repeat = 10

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "list"
show_all_files = true

[bootstrap.macos.defaults]
NSGlobalDomain.AppleShowAllExtensions = true
NSGlobalDomain.NSNavPanelExpandedStateForSaveMode = true
NSGlobalDomain.AppleKeyboardUIMode = 3
NSGlobalDomain.NSWindowShouldDragOnGesture = true
"com.apple.finder".FXDefaultSearchScope = "SCcf"
"com.apple.assistant.support"."Assistant Enabled" = false
"com.apple.Siri".UserHasDeclinedEnable = true
"com.apple.WindowManager".StandardHideWidgets = true
"com.apple.WindowManager".StageManagerHideWidgets = true
"com.apple.ncprefs".content_visibility = 2
NSGlobalDomain._HIHideMenuBar = true
NSGlobalDomain.AppleMenuBarVisibleInFullscreen = false
"com.apple.controlcenter".AutoHideMenuBarOption = 0
NSGlobalDomain."com.apple.mouse.scaling" = 1.0              # seeded from a trackpad, corrected for the mouse in the settings pass
"com.apple.Terminal".SecureKeyboardEntry = false            # while Terminal is in front it blocks every AeroSpace and Vorssaint hotkey
# Vorssaint seeds only what differs from the app's defaults. mise writes them
# before the final hook first opens the app. Several modules ship with their
# switch unset.
"com.vorssaint.utils".commandBarShortcut = "command:49"     # Cmd+Space; the Command Bar ships unbound
"com.vorssaint.utils".commandBarShortcutEnabled = true
"com.vorssaint.utils".commandBarCompactMode = true
"com.vorssaint.utils".launchAtLoginWanted = true
"com.vorssaint.utils".panelShowControls = false
"com.vorssaint.utils".panelShowToggles = false
"com.vorssaint.utils".quitProtectionQuitHoldDurationMs = 250.0  # the app stores a float
"com.vorssaint.utils".quitProtectionQuitShowFeedback = false
"com.vorssaint.utils".quitProtectionCloseShowFeedback = false
"com.vorssaint.utils"."featureAvailable.commandBar" = true
"com.vorssaint.utils"."featureAvailable.clipboardHistory" = true
"com.vorssaint.utils"."featureAvailable.urlCleaner" = true
"com.vorssaint.utils"."featureAvailable.finderCutPaste" = true
"com.vorssaint.utils"."featureAvailable.quitWindowProtection" = true
"com.vorssaint.utils"."featureAvailable.smoothScroll" = true
"com.vorssaint.utils"."featureAvailable.scrollInverter" = true
"com.vorssaint.utils"."featureAvailable.mouseAcceleration" = true
"com.vorssaint.utils"."featureAvailable.musicBlock" = true
"com.vorssaint.utils"."featureAvailable.audioPriority" = true
"com.vorssaint.utils".clipboardHistoryEnabled = true
"com.vorssaint.utils".urlCleanerEnabled = true
"com.vorssaint.utils".finderCutPasteEnabled = true
"com.vorssaint.utils".quitProtectionQuitEnabled = true
"com.vorssaint.utils".smoothScrollEnabled = true
"com.vorssaint.utils".scrollInverterEnabled = true
"com.vorssaint.utils".mouseAccelerationDisabled = true
"com.vorssaint.utils".musicBlockEnabled = true
"com.vorssaint.utils".audioPriorityInputEnabled = true
"com.vorssaint.utils".audioPriorityOutputEnabled = true

# ------------------------------------------------------------------- hooks --
# Hooks run on system binaries only; anything needing a manifest tool is in
# [tasks.bootstrap].

[bootstrap.hooks.pre-packages]
# The only path to everything in a third-party tap; see the note in
# [bootstrap.packages]. Always on, so it can no longer be a fallback nobody
# remembers to set. The script names those packages, and update:apps upgrades
# the same list through it.
run = "{{ config_root }}/bin/brew-tap-packages install"  # absolute: a bare path would follow the caller's cwd

[bootstrap.hooks.post-defaults]
run = "{{ config_root }}/bin/macos-post-defaults"  # a bare relative path would depend on the caller's cwd

[bootstrap.hooks.final]
# Registers start-at-login and raises the permission dialogs.
run = [
  "open -a AeroSpace || true",
  "open -a Karabiner-Elements || true",
  "open -a Vorssaint || true",
]

# ------------------------------------------------------------------- tasks --

[tasks.bootstrap]
description = "Runs after the tools phase with the manifest's tools on PATH."
run = [
  "bat cache --build",  # delta and bat fall back silently without it
  # Repo-local on purpose: a --global write would land in the tracked git config.
  "git -C {{ config_root }} config filter.pi-settings.clean \"jq 'del(.lastChangelogVersion)'\"",
  "mise run setup-agents",
]

[tasks.setup-git]
description = "Write the local git identity, profiles and SSH key; flip remotes to SSH."
run = "{{ config_root }}/bin/setup-git"

[tasks.refresh-unslop]
description = "Refetch the unslop rules into the marked block of home/.agents/AGENTS.md."
# Source is Lauren Tan's pstack plugin, MIT. Frontmatter, title and the
# Process section are stripped; the rules are the payload.
run = """
  set -eu
  file="{{ config_root }}/home/.agents/AGENTS.md"
  url="https://raw.githubusercontent.com/cursor/plugins/main/pstack/skills/unslop/SKILL.md"
  [ -f "$file" ] || { echo "refresh-unslop: $file is missing"; exit 1; }
  if ! grep -q '<!-- unslop:start -->' "$file" || ! grep -q '<!-- unslop:end -->' "$file"; then
    echo "refresh-unslop: markers missing in $file"; exit 1
  fi
  body=$(mktemp)
  curl -fsSL "$url" | awk '
    /^---$/ && fm < 2 { fm++; next }
    fm < 2 { next }
    /^# Unslop/ { next }
    /^## Process/ { skip = 1; next }
    /^## / { skip = 0 }
    !skip { print }
  ' > "$body"
  # A failed fetch must not replace the block with nothing.
  [ -s "$body" ] || { echo "refresh-unslop: fetch returned nothing, file untouched"; rm -f "$body"; exit 1; }
  {
    awk '{ print } /<!-- unslop:start -->/ { exit }' "$file"
    echo "<!-- Rules by Lauren Tan, github.com/cursor/plugins (pstack/skills/unslop), MIT."
    echo "     Rewritten by mise run refresh-unslop; edit upstream, not here. -->"
    cat "$body"
    awk 'f { print } /<!-- unslop:end -->/ { f = 1; print }' "$file"
  } > "$file.new"
  mv "$file.new" "$file"
  rm -f "$body"
"""

[tasks.check]
description = "Parse the manifest and run every script dry."
run = "sh {{ config_root }}/tests/smoke.sh"

# Every bind sits on Option and avoids the characters Finnish types with it.
# Digits stay free for @ and $, and Alt+F stays zsh's forward-word.
config-version = 2

# Borders takes its colours from the bar's palette so the two never drift.
# A `borders` process survives a logout, and the next login starts a second
# one. A `borders` that finds another running sends it its flags and exits.
# So the old one is stopped first, and the line waits until it has exited.
after-startup-command = [
  'exec-and-forget pkill -x borders; for _ in {1..20}; do pgrep -qx borders || break; sleep 0.1; done; source ~/.config/sketchybar/colors.sh && borders style=round width=6 hidpi=on active_color=$ACCENT inactive_color=$GUTTER',
]

start-at-login = true
# The file links into the clone, so saving it there applies it.
auto-reload-config = true

# Empty workspaces stay alive, so the bar always shows five.
persistent-workspaces = ['1', '2', '3', '4', '5']

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.bottom = 8
gaps.outer.right = 8
# Room for the bar, which draws in the notch strip.
gaps.outer.top = 40

[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-q = 'workspace 1'
alt-w = 'workspace 2'
alt-e = 'workspace 3'
alt-r = 'workspace 4'
alt-t = 'workspace 5'

alt-shift-q = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-w = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-e = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-r = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-t = 'move-node-to-workspace --focus-follows-window 5'

alt-tab = 'workspace-back-and-forth'
alt-shift-f = 'fullscreen'
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
# Pauses tiling. A paused AeroSpace hears no keys at all, so resume with
# `aerospace enable on` in a terminal.
q = 'enable off'

# First match wins. A rule for an app this Mac lacks never matches.
[[on-window-detected]]
if = 'test %{app-bundle-id} = org.mozilla.thunderbird || test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if = 'test %{app-bundle-id} = net.librewolf.librewolf || test %{app-bundle-id} = com.google.Chrome'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.mitchellh.ghostty'
run = 'move-node-to-workspace 3'

# Everything else floats on the current workspace.
[[on-window-detected]]
if = 'true'
run = 'layout floating'

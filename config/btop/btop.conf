# Three keys and nothing else. btop ships a 150-key default file; anything not
# named here is whatever the installed version defaults to.
color_theme = "tokyonight_night"
theme_background = False
# btop's Config::write() truncates and rewrites this whole file when you quit,
# and the file is a symlink into the repo, so without this every look at CPU
# usage leaves the working tree dirty.
save_config_on_exit = False

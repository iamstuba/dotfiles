# Work overlay, symlinked beside the global config and read only when MISE_ENV
# includes "work". The installer writes ~/.config/mise/miserc.toml with
# env = ["work"] when told to; that file is never tracked. MISE_ENV
# cannot live in a mise.toml because it decides which mise.toml files load.
# It holds the work Mac's tools, env, settings, JDK postinstall and tasks, and
# the packages it adds.
# Packages it turns off are in the repo-root mise.work.toml.

[tools]
# Only the work Mac uses gitlab.com, so glab lives here. brew:glab is the
# fallback; aqua's entry lists no versions and carries no checksum.
"gitlab:gitlab-org/cli" = "latest"
# Temurin is the JDK the work repos' images and CI build on. The [hooks]
# postinstall below imports the keychain's CAs into every JDK mise installs.
java = "temurin-25"
# The minimal profile leaves out the 920 MB docs component. The postinstall
# stops rustup checking for its own updates in the background.
rust = { version = "latest", profile = "minimal", components = ["clippy", "rustfmt", "rust-analyzer"], postinstall = "rustup set auto-self-update disable" }
# prost-build finds protoc on PATH, so the overlay sets no PROTOC and installs
# no cmake.
protoc = "latest"
# Colima runs the docker engine in a Lima VM. The user starts and stops it
# by hand, so it runs only when asked. Lima on its own is the fallback
# runtime.
colima = "latest"
lima = "latest"
# Compose v2 is a docker CLI plugin. The postinstall reruns on every upgrade,
# so the link in ~/.docker/cli-plugins always names the installed version.
docker-compose = { version = "latest", postinstall = 'mkdir -p "$HOME/.docker/cli-plugins" && ln -sfn "$MISE_TOOL_INSTALL_PATH/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"' }
# The release binary is named buildx-<version>.darwin, and docker loads a
# plugin only as docker-<name>, so bin renames it. Its postinstall links it
# the way compose's does.
"github:docker/buildx" = { version = "latest", bin = "docker-buildx", postinstall = 'mkdir -p "$HOME/.docker/cli-plugins" && ln -sfn "$MISE_TOOL_INSTALL_PATH/docker-buildx" "$HOME/.docker/cli-plugins/docker-buildx"' }
# On PATH, it makes docker login set credsStore and keep the token in the
# login keychain, not base64 in ~/.docker/config.json. The release also
# carries a pass helper for macOS, so matching picks this one.
"github:docker/docker-credential-helpers" = { version = "latest", bin = "docker-credential-osxkeychain", matching = "osxkeychain" }

[bootstrap.packages]
# Homebrew builds the docker CLI from source, and mise's docker-cli takes its
# first download on trust.
"brew:docker" = "latest"

[env]
# Telemetry doubles every request the bar's chip makes, and reports usage.
GLAB_SEND_TELEMETRY = "0"
# glab falls back to ~/Library/Application Support when XDG_CONFIG_HOME is
# unset, as it is in the installer and a GUI-launched bar.
GLAB_CONFIG_DIR = "{{ env.HOME }}/.config/glab-cli"
# aws configure otherwise offers to install skills and an MCP server into
# coding agents' config dirs.
AWS_CLI_AGENT_TOOLKIT_HINT_DISABLED = "true"
# Node reads the Keychain itself, so a CA rotation reaches it with no file to
# refresh. NODE_EXTRA_CA_CERTS stays out, and a repo on a Node too old for
# this sets it in its own mise.local.toml.
NODE_USE_SYSTEM_CA = "1"
# Gradle's toolchain lookup reads asdf's data dir, which is where mise keeps
# its JDKs.
ASDF_DATA_DIR = "{{ env.HOME }}/.local/share/mise"
# cargo update picks crates whose rust-version the repo's toolchain meets, and
# a newer one only when none fits, so a local update keeps CI's older Rust
# building.
CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS = "fallback"
# Keeps the VM disk out of ~/.config. While this directory does not exist,
# Colima ignores the variable and uses ~/.config/colima.
COLIMA_HOME = "{{ env.HOME }}/.local/share/colima"
# docker and Testcontainers find the VM's socket here, so Colima needs no
# Docker context. DOCKER_API_VERSION stays per repo, since it pins the CLI
# too.
DOCKER_HOST = "unix://{{ env.HOME }}/.local/share/colima/default/docker.sock"
# Testcontainers mounts this socket into Ryuk and its other helper
# containers, and the Mac's socket path does not exist inside the VM.
TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE = "/var/run/docker.sock"

[settings]
# This list replaces config.toml's, so node repeats. mise sets
# RUSTUP_TOOLCHAIN, which outranks a repo's rust-toolchain.toml unless mise
# reads that file itself, so rust is on the list. java stays out, because a
# bare 21 in .java-version would install a duplicate JDK.
idiomatic_version_file_enable_tools = ["node", "rust"]

[hooks]
# Global, so it fires for every JDK mise installs anywhere: a repo's pin, a
# mise x on demand and mise upgrade. A failing hook only warns, so an install
# never stops on it; ca:refresh is what reports a failed import.
postinstall = 'sh "${DOTFILES:-$HOME/projects/iamstuba/dotfiles}/bin/keychain-ca" jdk'

[tasks."ca:refresh"]
description = "Re-export the keychain's CAs and import them into every mise JDK."
# A global task cannot use {{ config_root }} to find the repo, so this
# resolves it the way update:apps does.
run = """
  set -eu
  ca="${DOTFILES:-$HOME/projects/iamstuba/dotfiles}/bin/keychain-ca"
  sh "$ca" export
  sh "$ca" jdk "${MISE_DATA_DIR:-$HOME/.local/share/mise}"/installs/java/*/
"""

# No run or description here, because either would replace config.toml's task
# instead of adding to it. A rotated CA is picked up on the next update.
[tasks."update:tools"]
depends_post = ["ca:refresh"]

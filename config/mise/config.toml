# Global half of the manifest, symlinked to ~/.config/mise/config.toml: tools,
# settings, and tasks that name no repo path. ~/.config/mise stays a real
# directory so miserc.toml and mise's state can live beside this file.

[settings]
minimum_release_age = "7d"                      # reaches tool backends, never casks
minimum_release_age_excludes = ["claude"]
idiomatic_version_file_enable_tools = ["node"]

[tools]
node = "lts"        # stays first: the npm: tools run on it
pnpm = "latest"

fzf = "latest"
fd = "latest"
ripgrep = "latest"
zoxide = "latest"
bat = "latest"
jq = "latest"
yq = "latest"
yazi = "latest"
starship = "latest"
glow = "latest"
shellcheck = "latest"
"github:agavra/tuicr" = "latest" # not in the registry; brew:tuicr is the fallback

delta = "latest"
lazygit = "latest"
github-cli = "latest" # the installer needs it before the clone exists

# mise owns every language server; mason is out.
"aqua:neovim/neovim" = "latest" # the registry default is a vfox plugin
stylua = "latest"
lua-language-server = "latest"
marksman = "latest"
oxlint = "latest"
oxfmt = "latest"
"npm:typescript" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"npm:bash-language-server" = "latest"

claude = "latest"

# Tools and packages are separate inventories and fail separately.

[tasks."update:tools"]
description = "Update mise itself and every tool in the manifest."
run = """
  mise self-update -y
  mise upgrade
"""

[tasks."update:apps"]
description = "Update Homebrew formulae and casks, both those mise pours and those it cannot resolve."
run = """
  # mise replaces LibreWolf's bundle even while it runs, so quit it first. A
  # clean quit, not pkill, writes the session its start page restores. Only a
  # running LibreWolf gets this far, so a Mac without LibreWolf never calls
  # osascript, which fails there.
  if pgrep -xq librewolf; then
    lw=net.librewolf.librewolf
    # LibreWolf reopens even after a failed upgrade. A failed reopen must not
    # fail an upgrade that worked, or update:all stops before update:plugins.
    trap 'open -b "$lw" || true' EXIT
    # A denied Automation prompt fails this, so the wait below times out. The
    # AppleScript timeout keeps a quit dialog from holding osascript for two
    # minutes.
    quit="tell application id \\"$lw\\" to quit"
    osascript -e 'with timeout of 30 seconds' -e "$quit" -e 'end timeout' || true
    waited=0
    while pgrep -xq librewolf; do
      if [ "$waited" -ge 30 ]; then
        echo "update:apps: LibreWolf did not quit; close it and rerun" >&2
        exit 1
      fi
      sleep 1
      waited=$((waited + 1))
    done
  fi
  # update:dotfiles resolves the repo the same way. This is the global file, so
  # {{ config_root }} here would be ~, not the repo.
  repo="${DOTFILES:-$HOME/projects/iamstuba/dotfiles}"
  # The task runs in ~, where mise finds no [bootstrap.packages] and upgrades
  # nothing. From the repo, mise also reads the overlay that MISE_ENV names.
  mise -C "$repo" bootstrap packages upgrade --yes
  # The tap packages are absent from [bootstrap.packages], so the line above
  # cannot see them and nothing else upgrades them.
  sh "$repo/bin/brew-tap-packages" upgrade
"""

[tasks."update:plugins"]
description = "Update Neovim plugins and write the lockfile."
run = 'nvim --headless "+lua vim.pack.update(nil, { force = true })" +qa'

[tasks."update:dotfiles"]
description = "Fast-forward this repository when it is on main."
run = """
  repo="${DOTFILES:-$HOME/projects/iamstuba/dotfiles}"
  if [ "$(git -C "$repo" symbolic-ref --short HEAD)" = "main" ]; then
    git -C "$repo" pull --ff-only origin main
  else
    echo "not on main, skipping"
  fi
"""

[tasks."update:all"]
description = "Everything, in order."
# A run array is serial; depends may run in parallel. dotfiles first, because
# update:plugins writes a tracked lockfile.
run = [
  { task = "update:dotfiles" },
  { task = "update:tools" },
  { task = "update:apps" },
  { task = "update:plugins" },
]

[tasks.setup-agents]
description = "Clear Claude Code's stray files and dead skill links."
# Every line is safe to rerun. config.personal.toml adds herdr's and pi's
# halves.
run = """
  rm -f ~/.claude/keybindings.json ~/.claude/.DS_Store ~/.claude/skills/.DS_Store
  # A local copy of unslop shadows the rules inlined into the shared
  # instruction file. -rf because it is a directory and its absence is normal.
  rm -rf ~/.claude/skills/unslop
  if [ -d ~/.claude/skills ]; then
    find ~/.claude/skills -maxdepth 1 -type l ! -exec test -e {} \\; -delete
  fi
"""

# Personal overlay of the global half, symlinked beside config.toml by
# mise.personal.toml and read only when MISE_ENV includes "personal". It holds
# pi, which a work Mac does not get. herdr runs on both Macs, so config.toml
# holds its half.

[settings]
minimum_release_age_excludes = ["pi"]

[tools]
pi = "latest"      # must stay on aqua:, never npm:

[tasks."setup-agents:pi"]
description = "Install herdr's pi integration and pi's skills package."
# herdr refuses a symlinked directory, so ~/.pi stays real. This half needs
# herdr's, which config.toml defines.
depends = ["setup-agents:herdr"]
run = """
  mkdir -p ~/.pi/agent
  herdr integration install pi
  pi install git:github.com/mattpocock/skills@v1.2.3
"""

[tasks."update:pi"]
description = "Update pi's extensions."
run = "pi update --extensions"

# No run or description here: either would replace config.toml's task instead
# of adding to it. depends, not depends_post: mise appends it to config.toml's
# list, so herdr's half runs once. As depends_post, pi's own dependency on
# herdr ran herdr's half a second time.
[tasks.setup-agents]
depends = ["setup-agents:pi"]

[tasks."update:tools"]
depends_post = ["update:pi"]

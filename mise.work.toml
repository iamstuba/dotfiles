# Repo-root half of the work overlay, read only when MISE_ENV includes "work".
# It holds what the global overlay cannot: the link to that overlay, and
# packages marked absent, which only a file outranking mise.toml can turn off.
# Tools and added packages stay in config/mise/config.work.toml.

[dotfiles]
"~/.config/mise/config.work.toml" = "config/mise/config.work.toml"

[bootstrap.packages]
# Not wanted on the work Mac. Here rather than in config/mise/config.work.toml
# because an entry there loses to mise.toml's declaration.
"brew-cask:librewolf" = { state = "absent" }
"brew-cask:proton-pass" = { state = "absent" }
"brew-cask:thunderbird" = { state = "absent" }
"brew-cask:proton-mail-bridge" = { state = "absent" }
# The work Mac brings its own Slack, so one app never has two sources.
"brew-cask:slack" = { state = "absent" }

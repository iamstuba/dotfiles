# Repo-root half of the work overlay, read only when MISE_ENV includes "work".
# It holds what the global overlay cannot: the work-only links and tasks that
# need the clone through {{ config_root }}. Tools stay in
# config/mise/config.work.toml.

[dotfiles]
# The global overlay itself and Colima's template. The template is a file
# link, because a linked directory would put the VM disk in the clone.
"~/.config/mise/config.work.toml" = "config/mise/config.work.toml"
"~/.local/share/colima/_templates/default.yaml" = "home/.local/share/colima/_templates/default.yaml"

[tasks."setup-claude:work"]
description = "Merge the work deny and ask lists into Claude Code's settings."
run = '"{{ config_root }}/bin/merge-claude-settings" "{{ config_root }}/home/.claude/settings.work.json"'

# This block has no command on purpose. A run would replace mise.toml's task instead of
# adding to it, and a description would replace its description.
[tasks.setup-claude]
depends_post = ["setup-claude:work"]

# docker finds a plugin only by its name in ~/.docker/cli-plugins. The opt
# path follows each brew upgrade, so the links never name a removed version.
[tasks.setup-docker]
description = "Link brew's docker compose and buildx into docker's plugin dir."
run = """
  set -eu
  opt=${HOMEBREW_PREFIX:-/opt/homebrew}/opt
  mkdir -p "$HOME/.docker/cli-plugins"
  for p in docker-compose docker-buildx; do
    ln -sfn "$opt/$p/bin/$p" "$HOME/.docker/cli-plugins/$p"
  done
"""

# No run or description, for setup-claude's reason.
[tasks.bootstrap]
depends_post = ["setup-docker"]
